name: learning-stack

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: learning_stack
      POSTGRES_USER: learning_stack
      POSTGRES_PASSWORD: learning_stack
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U learning_stack -d learning_stack"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
